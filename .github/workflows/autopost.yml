name: autopost
# Один запуск работает ~5,5 ч: каждые 5 минут публикует всё, чему пора, между публикациями бот отвечает в чате,
# и в конце сам запускает следующий. Cron — запасной вариант, если цепочка оборвётся.
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: autopost
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Публикация в Telegram (цикл ~5,5 ч)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          git config user.name "bfep-autopost"
          git config user.email "autopost@bfep.space"
          end=$(( $(date +%s) + 330*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            git pull -q --rebase || true
            python3 post.py || true
            python3 discord_post.py || true  # Discord BEEZOO по discord.json
            python3 x_post.py || true  # X @beezoospace по x.json
            for f in posted.json bot_state.json stats.json posted_discord.json posted_x.json; do [ -f "$f" ] && git add "$f"; done; true  # по одному: отсутствующий файл не должен срывать git add остальных
            git diff --cached --quiet || (git commit -qm "posted $(date -u +%FT%TZ)" && git push -q) || true
            python3 bot.py 300 || sleep 60  # бот слушает чат 5 минут (если выключен — просто ждёт)
          done
      - name: Запустить следующий цикл
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run autopost.yml --ref main -R ${{ github.repository }}
