name: autopost
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: autopost
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Публикация в Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: python3 post.py
      - name: Сохранить, что уже опубликовано
        if: always()
        run: |
          git config user.name "bfep-autopost"
          git config user.email "autopost@bfep.space"
          git add posted.json
          git diff --cached --quiet || (git commit -m "posted $(date -u +%FT%TZ)" && git push)
